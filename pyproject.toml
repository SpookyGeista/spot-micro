[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-micro-training"
version = "0.1.0"
description = "Isaac Lab locomotion training for a PWM-servo Spot Micro with IMU-only feedback"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["spot_micro*"]
